<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.15"/>
    </filter>
    
    <style>
      @keyframes pulsePath {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .anim-flow {
        stroke-dasharray: 8 6;
        animation: pulsePath 2.5s linear infinite;
      }
      .anim-pulse {
        animation: pulseGlow 2s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .code-font {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  
  <!-- Grid Overlay -->
  <g opacity="0.15">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200" stroke="#38bdf8" stroke-width="0.5"/>
    <path d="M100,0 V630 M200,0 V630 M300,0 V630 M400,0 V630 M500,0 V630 M600,0 V630 M700,0 V630 M800,0 V630 M900,0 V630 M1000,0 V630 M1100,0 V630" stroke="#38bdf8" stroke-width="0.5"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#38bdf8" class="anim-pulse"/>
    <text x="24" y="16" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">ARCHIFY • RUNTIME MAP</text>
    <text x="0" y="55" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.5">Secure Voting System • Runtime Architecture</text>
    <text x="0" y="76" fill="#94a3b8" font-size="13">Anti-Fraud Verification • Parameterized SQL • Real-Time Fetch Aggregation</text>
  </g>

  <g transform="translate(930, 45)">
    <rect x="0" y="0" width="210" height="40" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="18" fill="#64748b" font-size="10" font-weight="600">VERIFIED STATE</text>
    <text x="15" y="32" fill="#10b981" font-size="12" font-weight="700">● 6 Nodes • 8 Checks PASS</text>
  </g>

  <!-- Zones -->
  <rect x="50" y="150" width="260" height="430" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="70" y="180" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.5">01 / CLIENT LAYER</text>

  <rect x="340" y="150" width="460" height="430" rx="12" fill="#0f172a" stroke="#0284c7" stroke-dasharray="4 4" stroke-width="1.5" fill-opacity="0.4"/>
  <text x="360" y="180" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">02 / SECURITY &amp; BACKEND LOGIC</text>

  <rect x="830" y="150" width="320" height="430" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#8b5cf6" stroke-dasharray="4 4" stroke-width="1.5"/>
  <text x="850" y="180" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1.5">03 / DATABASE (MYSQL)</text>

  <!-- Animated Paths -->
  <path d="M 280 250 L 370 250" fill="none" stroke="#38bdf8" stroke-width="2.5" class="anim-flow"/>
  <path d="M 540 250 L 610 250" fill="none" stroke="#38bdf8" stroke-width="2.5" class="anim-flow"/>
  <path d="M 770 250 L 860 250" fill="none" stroke="#10b981" stroke-width="2.5" class="anim-flow"/>
  <path d="M 280 390 L 370 390" fill="none" stroke="#8b5cf6" stroke-width="2.5" class="anim-flow"/>
  <path d="M 540 390 L 860 390" fill="none" stroke="#8b5cf6" stroke-width="2.5" class="anim-flow"/>
  <path d="M 280 505 L 860 505" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Nodes -->
  <g transform="translate(70, 210)">
    <rect width="210" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-card)"/>
    <circle cx="25" cy="28" r="6" fill="#38bdf8"/>
    <text x="40" y="32" fill="#ffffff" font-size="14" font-weight="700">Voter Interface</text>
    <text x="40" y="50" fill="#94a3b8" font-size="11" class="code-font">index.php</text>
    <rect x="40" y="58" width="145" height="14" rx="3" fill="#0284c7" fill-opacity="0.2"/>
    <text x="45" y="69" fill="#38bdf8" font-size="9" font-weight="600">POST + CSRF Token + SESS</text>
  </g>

  <g transform="translate(70, 350)">
    <rect width="210" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="25" cy="28" r="6" fill="#a78bfa"/>
    <text x="40" y="32" fill="#ffffff" font-size="14" font-weight="700">Live Dashboard</text>
    <text x="40" y="50" fill="#94a3b8" font-size="11" class="code-font">hasil.php</text>
    <rect x="40" y="58" width="145" height="14" rx="3" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="45" y="69" fill="#c084fc" font-size="9" font-weight="600">AJAX Polling (5s interval)</text>
  </g>

  <g transform="translate(70, 470)">
    <rect width="210" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <circle cx="25" cy="25" r="5" fill="#f59e0b"/>
    <text x="40" y="29" fill="#ffffff" font-size="13" font-weight="700">Admin Control</text>
    <text x="40" y="46" fill="#94a3b8" font-size="11" class="code-font">admin.php (Auth Gate)</text>
  </g>

  <g transform="translate(370, 210)">
    <rect width="170" height="80" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="15" y="28" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="1">HANDLER</text>
    <text x="15" y="48" fill="#ffffff" font-size="14" font-weight="700">Vote Processor</text>
    <text x="15" y="66" fill="#94a3b8" font-size="11" class="code-font">proses_vote.php</text>
  </g>

  <g transform="translate(610, 200)">
    <rect width="160" height="100" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.8" filter="url(#glow-cyan)"/>
    <text x="15" y="24" fill="#38bdf8" font-size="9" font-weight="800" letter-spacing="1">SECURITY GATEWAY</text>
    <text x="15" y="44" fill="#ffffff" font-size="13" font-weight="700">Anti-Fraud Engine</text>
    <text x="15" y="62" fill="#7dd3fc" font-size="10">• CSRF Token Match</text>
    <text x="15" y="76" fill="#7dd3fc" font-size="10">• IP / SESS Duplicate</text>
    <text x="15" y="90" fill="#7dd3fc" font-size="10">• Prepared Stmt (SQLi)</text>
  </g>

  <g transform="translate(370, 350)">
    <rect width="170" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="15" y="28" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1">REST API</text>
    <text x="15" y="48" fill="#ffffff" font-size="14" font-weight="700">JSON Endpoint</text>
    <text x="15" y="66" fill="#94a3b8" font-size="11" class="code-font">get_hasil.php</text>
  </g>

  <g transform="translate(860, 210)">
    <rect width="260" height="130" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="260" height="28" rx="8" fill="#064e3b" fill-opacity="0.6"/>
    <text x="15" y="19" fill="#34d399" font-size="12" font-weight="700">TABLE: vote</text>
    <text x="15" y="48" fill="#cbd5e1" font-size="11" class="code-font">PK: id (INT AUTO_INCREMENT)</text>
    <text x="15" y="68" fill="#cbd5e1" font-size="11" class="code-font">FK: kandidat_id (INT)</text>
    <text x="15" y="88" fill="#38bdf8" font-size="11" class="code-font">IDX: ip_address (VARCHAR)</text>
    <text x="15" y="108" fill="#38bdf8" font-size="11" class="code-font">IDX: session_id (VARCHAR)</text>
    <text x="15" y="124" fill="#64748b" font-size="10">waktu_vote (DATETIME)</text>

    <g transform="translate(0, 160)">
      <rect width="260" height="120" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect width="260" height="28" rx="8" fill="#4c1d95" fill-opacity="0.6"/>
      <text x="15" y="19" fill="#c084fc" font-size="12" font-weight="700">TABLE: kandidat</text>
      <text x="15" y="48" fill="#cbd5e1" font-size="11" class="code-font">PK: id (INT AUTO_INCREMENT)</text>
      <text x="15" y="68" fill="#cbd5e1" font-size="11" class="code-font">nama_kandidat (VARCHAR)</text>
      <text x="15" y="88" fill="#cbd5e1" font-size="11" class="code-font">deskripsi (TEXT)</text>
      <text x="15" y="108" fill="#64748b" font-size="10">created_at (DATETIME)</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 595)">
    <circle cx="5" cy="5" r="4" fill="#38bdf8"/>
    <text x="15" y="9" fill="#94a3b8" font-size="11">Active Dataflow</text>
    <circle cx="140" cy="5" r="4" fill="#10b981"/>
    <text x="150" y="9" fill="#94a3b8" font-size="11">Secured Prepared Stmt</text>
    <circle cx="310" cy="5" r="4" fill="#8b5cf6"/>
    <text x="320" y="9" fill="#94a3b8" font-size="11">Real-Time Aggregation</text>
    <circle cx="490" cy="5" r="4" fill="#f59e0b"/>
    <text x="500" y="9" fill="#94a3b8" font-size="11">Admin Operations</text>
  </g>
</svg>
